<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GUARDIÃO PRO IA">
  <title>GUARDIÃO PRO IA</title>
  <defs>
    <linearGradient id="gpi-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#c9a300"/>
    </linearGradient>
  </defs>

  <!-- escudo: identidade de "guardião", em dourado como na marca atual -->
  <path d="M64 10 L108 26 v34c0 26-18 45-44 58C38 105 20 86 20 60V26Z"
        fill="#0a0a0a" stroke="url(#gpi-shield)" stroke-width="7" stroke-linejoin="round"/>

  <!-- rede neural: o "IA". Verde, que é a cor que o front usa -->
  <g stroke="#00d96d" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M64 44 v40"/>
    <path d="M64 56 L46 44"/>
    <path d="M64 56 L82 44"/>
    <path d="M64 72 L46 84"/>
    <path d="M64 72 L82 84"/>
  </g>
  <g fill="#00d96d">
    <circle cx="64" cy="40" r="7"/>
    <circle cx="46" cy="41" r="5.5"/>
    <circle cx="82" cy="41" r="5.5"/>
    <circle cx="46" cy="87" r="5.5"/>
    <circle cx="82" cy="87" r="5.5"/>
  </g>
  <!-- núcleo em dourado: o ponto onde escudo e IA se encontram -->
  <circle cx="64" cy="88" r="7.5" fill="#FFD700"/>
</svg>
