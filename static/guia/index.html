<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070A08" />
<title>Guardião · Guia Rápido</title>
<meta name="description" content="Seu guia passo a passo do Guardião. Simples, no seu ritmo." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   GUARDIÃO — Guia Rápido (área de membros, público 50+)
   Estilo Netflix/Amazon: capa em destaque + fileiras de aulas.
   Contatos: window.GUIA_CONFIG (logo abaixo do <body>).
   ========================================================== */
:root{
  --bg:#070A08; --bg-2:#0C110E; --surface:#121A15; --surface-2:#1A241E; --surface-3:#243029;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --green:#25D06F; --green-deep:#0E9E52; --green-soft:rgba(37,208,111,.14);
  --gold:#F5C542;
  --text:#F4F8F5; --muted:#AAB6AF; --muted-2:#7C8A82;
  --radius:22px; --radius-sm:16px; --tap:60px; --wrap:600px;
  --wa:#25D366;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
svg{display:block}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px 150px}

/* Header */
.top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(7,10,8,.96),rgba(7,10,8,.75) 70%,transparent);
  backdrop-filter:blur(8px)}
.top .wrap{padding:14px 16px 16px;display:flex;align-items:center;gap:11px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{width:34px;height:34px;color:var(--green)}
.logo .wm{font-size:19px;font-weight:900;letter-spacing:.15em;line-height:1}
.logo .wm small{display:block;font-size:10px;letter-spacing:.28em;color:var(--muted-2);font-weight:800;margin-top:3px}

/* HERO (Netflix spotlight) */
.hero{position:relative;border-radius:var(--radius);overflow:hidden;min-height:430px;
  display:flex;align-items:flex-end;background:#0f1712;border:1px solid var(--line)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02)}
.hero .grad{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(7,10,8,.15) 0%,rgba(7,10,8,.55) 45%,rgba(7,10,8,.97) 100%)}
.hero .ct{position:relative;width:100%;padding:22px 20px 22px}
.hero .kick{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bg);background:var(--green);padding:6px 11px;border-radius:999px}
.hero h1{font-size:27px;font-weight:900;line-height:1.18;margin:14px 0 6px}
.hero .sub{font-size:16px;color:#d7e0da;margin:0 0 18px;max-width:34ch}
.hero .play{width:100%;min-height:var(--tap);border:none;border-radius:15px;background:var(--green);color:#04130A;
  font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 26px rgba(37,208,111,.28)}
.hero .play svg{width:26px;height:26px;flex:0 0 auto}
.hero .metaline{display:flex;align-items:center;gap:12px;margin-top:14px}
.hero .barwrap{flex:1;height:8px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
.hero .bar{height:100%;width:0;background:var(--green);border-radius:999px;transition:width .5s}
.hero .ptxt{font-size:14px;font-weight:800;color:#cdd6d0;white-space:nowrap}

/* Search */
.search{margin:26px 0 4px}
.search h2{font-size:20px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:9px}
.search h2 svg{width:22px;height:22px;color:var(--green)}
.sbox{position:relative}
.sbox svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted-2)}
.sbox input{width:100%;min-height:var(--tap);padding:0 16px 0 52px;font-size:17px;color:var(--text);
  background:var(--surface);border:2px solid var(--line-2);border-radius:16px}
.sbox input::placeholder{color:var(--muted-2)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:10px 15px;font-size:15px;font-weight:600}
.chip svg{width:18px;height:18px;color:var(--green)}
.chip:active{background:var(--surface-3)}
.results{margin-top:14px;display:none;flex-direction:column;gap:10px}
.results.show{display:flex}
.res-empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;font-size:16px;color:var(--muted)}

/* Section head */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:32px 0 14px}
.sec h2{font-size:22px;font-weight:800;margin:0}
.sec .kick{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--green);text-transform:uppercase;margin:0 0 3px}

/* Primeiros passos — cover cards (vertical, claro) */
.covers{display:flex;flex-direction:column;gap:16px}
.cover{position:relative;background:#0f1712;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;width:100%;display:block}
.cover .img{aspect-ratio:16/9;background-size:cover;background-position:center;position:relative;background-color:#12201a}
.cover .img .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,8,.05),rgba(7,10,8,.75))}
.cover .num{position:absolute;left:12px;top:11px;min-width:46px;height:46px;padding:0 8px;border-radius:13px;
  background:rgba(7,10,8,.55);backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff}
.cover .pill{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:6px;background:var(--green);
  color:#04130A;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:900}
.cover .pill svg{width:15px;height:15px}
.cover .pbtn{position:absolute;right:14px;bottom:-26px;width:56px;height:56px;border-radius:50%;background:var(--green);
  color:#04130A;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.5);border:3px solid var(--bg)}
.cover .pbtn svg{width:26px;height:26px}
.cover .meta{padding:16px 16px 18px}
.cover .meta .t{font-size:20px;font-weight:800;line-height:1.25;padding-right:54px}
.cover .meta .s{font-size:15px;color:var(--muted);margin-top:6px}
.cover.done{border-color:rgba(37,208,111,.4)}

/* Rails (Netflix rows) */
.rail{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:2px 16px 10px;margin:0 -16px}
.rail::-webkit-scrollbar{height:0;display:none}
.tile{flex:0 0 70%;max-width:240px;scroll-snap-align:start;background:#0f1712;border:1px solid var(--line);
  border-radius:var(--radius-sm);overflow:hidden;text-align:left}
.tile .img{aspect-ratio:16/9;background-size:cover;background-position:center;position:relative;background-color:#12201a}
.tile .img .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,8,0),rgba(7,10,8,.55))}
.tile .pbtn{position:absolute;right:9px;bottom:9px;width:40px;height:40px;border-radius:50%;background:rgba(7,10,8,.55);
  backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.25);color:#fff;display:grid;place-items:center}
.tile .pbtn svg{width:20px;height:20px}
.tile.done .pbtn{background:var(--green);color:#04130A;border-color:transparent}
.tile .t{padding:12px 13px 15px;font-size:15px;font-weight:700;line-height:1.3}
.fallback{display:grid;place-items:center;background:linear-gradient(135deg,#0e2a1c,#0a1712)}
.fallback svg{width:40px;height:40px;color:rgba(255,255,255,.5)}

/* Full members CTA */
.full{margin-top:30px;background:linear-gradient(135deg,rgba(245,197,66,.14),transparent);
  border:1px solid var(--line-2);border-radius:var(--radius);padding:20px;display:flex;gap:15px;align-items:center}
.full .ic{flex:0 0 auto;width:48px;height:48px;border-radius:13px;background:rgba(245,197,66,.16);color:var(--gold);display:grid;place-items:center}
.full .ic svg{width:26px;height:26px}
.full .tx{flex:1;min-width:0}
.full .tx .t{font-size:17px;font-weight:800}
.full .tx .s{font-size:14px;color:var(--muted);margin-top:2px}
.full .go{flex:0 0 auto;color:var(--gold)}
.full .go svg{width:26px;height:26px}

.foot{margin-top:34px;text-align:center;color:var(--muted-2);font-size:14px;line-height:1.7}
.foot b{color:var(--muted)}

/* Floating help */
.fab{position:fixed;right:16px;bottom:18px;z-index:60;display:flex;align-items:center;gap:9px;background:var(--wa);
  color:#04130A;border:none;border-radius:999px;padding:14px 20px 14px 15px;font-size:17px;font-weight:800;
  box-shadow:0 10px 26px rgba(0,0,0,.5)}
.fab svg{width:25px;height:25px}

/* Lesson overlay */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(4,7,5,.66);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:100%;max-width:var(--wrap);max-height:95vh;overflow-y:auto;background:var(--bg);
  border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid var(--line-2);
  padding:0 16px calc(28px + env(safe-area-inset-bottom));animation:up .28s ease}
@keyframes up{from{transform:translateY(28px)}to{transform:translateY(0)}}
.sheet-top{position:sticky;top:0;background:var(--bg);padding:16px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);z-index:2}
.sheet-top .lbl{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--green);text-transform:uppercase}
.sheet-top .x{width:46px;height:46px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);display:grid;place-items:center}
.sheet-top .x svg{width:22px;height:22px}
.sheet h3{font-size:22px;font-weight:800;line-height:1.25;margin:16px 0 14px}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .novid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;color:var(--muted);gap:10px}
.nb{margin:18px 0 6px;background:var(--green-soft);border:1px solid rgba(37,208,111,.34);border-radius:16px;padding:16px;display:flex;gap:12px}
.nb .ic{flex:0 0 auto;color:var(--green)}
.nb .ic svg{width:24px;height:24px}
.nb .h{font-size:13px;font-weight:900;color:var(--green);letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.nb .c{font-size:16px;margin:0}
.acts{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.btn{width:100%;min-height:58px;border:none;border-radius:14px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px}
.btn svg{width:22px;height:22px}
.btn-done{background:var(--green);color:#04130A}
.btn-done.on{background:var(--surface-3);color:var(--text);border:1px solid var(--line-2)}
.btn-next{background:var(--gold);color:#1A1400}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
</style>
</head>

      kw:["saque","sacar","tirar dinheiro","retirar","receber","resgatar","pegar meu dinheiro","retirada","tirar meu dinheiro","como recebo","levantar"]},
    {key:"suporte",step:6,cat:"passo",title:"Suporte, Comunidade e LIVE OURO",desc:"Onde pedir ajuda, falar com pessoas e acompanhar as lives.",type:"yt",vid:"puVIT6AHvdM",
      next:"Tudo certo! Você concluiu os primeiros passos. Fale com a gente sempre que precisar.",
      kw:["suporte","ajuda","atendimento","falar com alguem","problema","comunidade","grupo","live","ouro","live ouro","contato","reclamar","nao consigo","não consigo"]},

    {key:"indicacao",cat:"extra",title:"Indicação / IB — ganhar indicando",desc:"Como ganhar indicando o Guardião.",type:"yt",vid:"osGq82UY804",
      next:"Quer indicar para amigos? Fale com o suporte que a gente te ajuda.",kw:["indicacao","indicação","indicar","ib","afiliado","ganhar indicando","convidar","amigos","comissao"]},
    {key:"guardiao-pro",cat:"extra",title:"Ative seu GUARDIÃO PRO",desc:"A versão PRO, o robô trabalhando mais forte.",type:"yt",vid:"LrCvZdp2JGs",
      next:"Ficou com dúvida sobre o PRO? Fale com o suporte.",kw:["pro","guardiao pro","versao pro","mais lucro","turbinar","upgrade","acelerador"]},
    {key:"reprise-live",cat:"extra",title:"Reprise da Live",desc:"Assista de novo a última transmissão.",type:"panda",vid:"https://player-vz-350772d9-cdc.tv.pandavideo.com.br/embed/?v=4ed2f726-3a78-4101-bbb0-b783f7c5c082",
      next:"Quer participar das próximas lives? Veja o passo “Suporte e Comunidade”.",kw:["reprise","live","ao vivo","transmissao","gravacao","assistir de novo","replay"]},

    {key:"mercado",cat:"curso",title:"Introdução ao Mercado Financeiro",type:"yt",vid:"GtJZlUIs6iw",next:"Continue para a próxima aula do curso quando quiser.",kw:["mercado","mercado financeiro","introducao","basico","aprender","curso"]},
    {key:"cenario-1",cat:"curso",title:"Análise de Cenário 1",type:"yt",vid:"Mc-h6av8eNU",next:"Siga para a Análise de Cenário 2.",kw:["cenario","analise de cenario","cenario 1"]},
    {key:"cenario-2",cat:"curso",title:"Análise de Cenário 2",type:"yt",vid:"Xgst9D0v0RA",next:"Siga para a Análise de Cenário 3.",kw:["cenario 2","analise 2"]},
    {key:"cenario-3",cat:"curso",title:"Análise de Cenário 3",type:"yt",vid:"xL3PCTS_dZE",next:"Continue com “Como Evitar Cenários Ruins”.",kw:["cenario 3","analise 3"]},
    {key:"evitar-cenarios",cat:"curso",title:"Como Evitar Cenários Ruins",type:"yt",vid:"pbEHHgafCY4",next:"Continue com “Como Executar Ordens”.",kw:["evitar","cenarios ruins","erros","evitar erros","cuidado","perigo"]},
    {key:"executar-ordens",cat:"curso",title:"Como Executar Ordens",type:"yt",vid:"PqHyhFLBEK4",next:"Continue com a Análise Gráfica.",kw:["ordens","executar","comprar","vender","entrada"]},
    {key:"grafica-1",cat:"curso",title:"Introdução à Análise Gráfica",type:"yt",vid:"7l1ffF4p8SU",next:"Siga para a Análise Gráfica — Parte 2.",kw:["grafico","analise grafica","grafica 1"]},
    {key:"grafica-2",cat:"curso",title:"Análise Gráfica — Parte 2",type:"yt",vid:"H1F_ivNqhDk",next:"Siga para a Análise Gráfica — Parte 3.",kw:["grafica 2","analise grafica 2"]},
    {key:"grafica-3",cat:"curso",title:"Análise Gráfica — Parte 3",type:"yt",vid:"h2_rRtIywX8",next:"Continue com o Indicador MACD.",kw:["grafica 3","analise grafica 3"]},
    {key:"macd",cat:"curso",title:"Indicador MACD",type:"yt",vid:"m0rWTABCEgw",next:"Continue com Gestão de Risco.",kw:["macd","indicador","indicadores"]},
    {key:"gestao-risco",cat:"curso",title:"Gestão de Risco",type:"yt",vid:"l7OR8aZYJnU",next:"Você concluiu o curso! Qualquer dúvida, fale com o suporte.",kw:["gestao de risco","risco","proteger","perder","stop","seguranca"]}
  ];
  var BY_KEY={};LESSONS.forEach(function(l){BY_KEY[l.key]=l;});
  var STEPS=LESSONS.filter(function(l){return l.cat==="passo";}).sort(function(a,b){return a.step-b.step;});

  /* ---------- Progresso ---------- */
  var PKEY="guia_progress_v2";
  function loadP(){try{return JSON.parse(localStorage.getItem(PKEY))||{done:[],last:null};}catch(e){return{done:[],last:null};}}
  function saveP(p){try{localStorage.setItem(PKEY,JSON.stringify(p));}catch(e){}}
  var P=loadP();
  function isDone(k){return P.done.indexOf(k)>=0;}
  function markDone(k){if(!isDone(k)){P.done.push(k);saveP(P);}}

  /* ---------- Miniaturas ---------- */
  function thumb(l){ return l.type==="yt" ? "https://i.ytimg.com/vi/"+l.vid+"/hqdefault.jpg" : null; }

  /* ---------- Suporte ---------- */
  function supportHref(msg){var t=encodeURIComponent(msg||"Olá! Preciso de ajuda com o Guardião.");
    return CFG.supportWhatsapp ? "https://wa.me/"+CFG.supportWhatsapp+"?text="+t
      : "mailto:"+CFG.supportEmail+"?subject="+encodeURIComponent("Ajuda - Guardião")+"&body="+t;}

  function normalize(s){return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}

  /* ---------- HERO ---------- */
  function renderHero(){
    var done=STEPS.filter(function(l){return isDone(l.key);}).length,total=STEPS.length;
    var next=null;for(var i=0;i<STEPS.length;i++){if(!isDone(STEPS[i].key)){next=STEPS[i];break;}}
    var allDone=!next;
    var target=next||STEPS[0];
    var t=thumb(target);
    document.getElementById("heroBg").style.backgroundImage=t?("url('"+t+"')"):"linear-gradient(135deg,#0e2a1c,#0a1712)";
    document.getElementById("heroKick").textContent=allDone?"Tudo concluído":(done>0?"Continue de onde parou":"Comece agora");
    document.getElementById("heroTtl").textContent=allDone?"Você concluiu os primeiros passos":("Passo "+target.step+": "+target.title);
    document.getElementById("heroSub").textContent=allDone?"Parabéns! Reveja qualquer aula quando quiser, ou explore o curso completo abaixo.":target.desc;
    var hp=document.getElementById("heroPlay");
    hp.innerHTML=ic('play')+" "+(allDone?"Rever do início":(done>0?"Continuar":"Assistir agora"));
    hp.onclick=function(){openLesson(target.key);};
    document.getElementById("heroBar").style.width=(done/total*100)+"%";
    document.getElementById("heroPtxt").textContent=done+" de "+total;
  }

  /* ---------- Cover cards (passos) ---------- */
  function renderCovers(){
    var el=document.getElementById("covers");el.innerHTML="";
    STEPS.forEach(function(l){
      var d=isDone(l.key),t=thumb(l);
      var c=document.createElement("button");c.className="cover"+(d?" done":"");c.setAttribute("aria-label",l.title);
      c.innerHTML=
        '<div class="img" style="'+(t?("background-image:url(\'"+t+"\')"):"")+'">'+
          '<div class="g"></div>'+
          '<span class="num">'+l.step+'</span>'+
          (d?('<span class="pill">'+ic('check')+'Concluído</span>'):'')+
          '<span class="pbtn">'+ic('play')+'</span>'+
        '</div>'+
        '<div class="meta"><div class="t">'+l.title+'</div><div class="s">Passo '+l.step+' de '+STEPS.length+' · toque para assistir</div></div>';
      c.addEventListener("click",function(){openLesson(l.key);});
      el.appendChild(c);
    });
  }

  /* ---------- Rails ---------- */
  function renderRail(id,items){
    var el=document.getElementById(id);el.innerHTML="";
    items.forEach(function(l){
      var d=isDone(l.key),t=thumb(l);
      var b=document.createElement("button");b.className="tile"+(d?" done":"");b.setAttribute("aria-label",l.title);
      b.innerHTML=
        '<div class="img '+(t?"":"fallback")+'" style="'+(t?("background-image:url(\'"+t+"\')"):"")+'">'+
          '<div class="g"></div>'+(t?"":ic('play'))+
          '<span class="pbtn">'+(d?ic('check'):ic('play'))+'</span>'+
        '</div>'+
        '<div class="t">'+l.title+'</div>';
      b.addEventListener("click",function(){openLesson(l.key);});
      el.appendChild(b);
    });
  }

  /* ---------- Busca ---------- */
  function searchLessons(query){
    var q=normalize(query).trim();if(!q)return[];
    var terms=q.split(/\s+/).filter(Boolean);
    return LESSONS.map(function(l){
      var hay=normalize(l.title+" "+(l.desc||"")+" "+l.kw.join(" "));var s=0;
      l.kw.forEach(function(k){var nk=normalize(k);if(q.indexOf(nk)>=0||nk.indexOf(q)>=0)s+=6;});
      terms.forEach(function(t){if(t.length<2)return;if(hay.indexOf(t)>=0)s+=2;l.kw.forEach(function(k){if(normalize(k).indexOf(t)>=0)s+=1;});});
      if(normalize(l.title).indexOf(q)>=0)s+=4;
      return{l:l,s:s};
    }).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).slice(0,3).map(function(x){return x.l;});
  }
  function resultRow(l){
    var stepTxt=l.step?("Passo "+l.step):(l.cat==="curso"?"Curso":"Extra");var t=thumb(l);
    var b=document.createElement("button");b.className="tile";b.style.flex="1 0 auto";b.style.maxWidth="none";
    b.innerHTML='<div style="display:flex;gap:13px;align-items:center;padding:10px">'+
      '<div class="img '+(t?"":"fallback")+'" style="width:120px;flex:0 0 auto;border-radius:12px;'+(t?("background-image:url(\'"+t+"\')"):"")+'">'+(t?"":ic('play'))+'</div>'+
      '<div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:800;line-height:1.25">'+l.title+'</div>'+
      '<div style="font-size:13px;color:var(--muted-2);margin-top:3px">'+stepTxt+' · toque para assistir</div></div></div>';
    b.addEventListener("click",function(){openLesson(l.key);});return b;
  }
  function renderResults(query){
    var box=document.getElementById("results");
    if(!query.trim()){box.classList.remove("show");box.innerHTML="";return;}
    var found=searchLessons(query);box.classList.add("show");box.innerHTML="";
    if(!found.length){var e=document.createElement("div");e.className="res-empty";
      e.innerHTML='Não encontrei uma aula exata para isso. Toque no botão verde <b>“Ajuda”</b> que a gente te responde rapidinho.';box.appendChild(e);return;}
    found.forEach(function(l){box.appendChild(resultRow(l));});
  }

  /* ---------- Chips ---------- */
  var CHIPS=[['wallet','depósito'],['bank','sacar'],['power','ativar o robô'],['userplus','abrir conta'],['chat','suporte']];
  (function(){var el=document.getElementById("chips");CHIPS.forEach(function(c){
    var b=document.createElement("button");b.className="chip";b.innerHTML=ic(c[0])+"<span>"+c[1]+"</span>";
    b.addEventListener("click",function(){var q=document.getElementById("q");q.value=c[1];renderResults(c[1]);document.getElementById("results").scrollIntoView({behavior:"smooth",block:"nearest"});});
    el.appendChild(b);});})();

  /* ---------- Overlay ---------- */
  var overlay=document.getElementById("overlay"),current=null;
  function videoHtml(l){
    if(l.type==="yt")return '<iframe src="https://www.youtube-nocookie.com/embed/'+l.vid+'?rel=0&modestbranding=1&playsinline=1" title="'+l.title+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
    if(l.type==="panda")return '<iframe src="'+l.vid+'" title="'+l.title+'" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
    return '<div class="novid">'+ic('play')+'<span>Esta etapa não tem vídeo — siga a orientação abaixo.</span></div>';
  }
  function nextStepOf(l){return l.cat==="passo"?(STEPS.find(function(s){return s.step===l.step+1;})||null):null;}
  function openLesson(key){
    var l=BY_KEY[key];if(!l)return;current=l;P.last=key;saveP(P);
    document.getElementById("stepLbl").textContent=l.step?("Passo "+l.step+" de "+STEPS.length):(l.cat==="curso"?"Curso de Trading":"Extra");
    document.getElementById("lTitle").textContent=l.title;
    document.getElementById("video").innerHTML=videoHtml(l);
    document.getElementById("nextTxt").textContent=l.next||"Quando terminar, volte e escolha o próximo passo.";
    var mb=document.getElementById("markBtn");mb.classList.toggle("on",isDone(l.key));
    mb.innerHTML=ic('check')+" "+(isDone(l.key)?"Passo concluído":"Concluí este passo");
    var nb=document.getElementById("nextBtn"),nx=nextStepOf(l);
    if(nx){nb.style.display="";nb.innerHTML="Próximo passo "+ic('arrow');nb.onclick=function(){openLesson(nx.key);document.getElementById("sheet").scrollTop=0;};}
    else nb.style.display="none";
    document.getElementById("helpBtn").innerHTML=ic('chat')+" Preciso de ajuda";
    overlay.classList.add("show");document.body.style.overflow="hidden";document.getElementById("sheet").scrollTop=0;
    if(history.replaceState)history.replaceState(null,"","#aula="+key);
  }
  function closeLesson(){
    overlay.classList.remove("show");document.body.style.overflow="";document.getElementById("video").innerHTML="";current=null;
    if(history.replaceState)history.replaceState(null,"",location.pathname+location.search);
    renderAll();
  }
  document.getElementById("close").addEventListener("click",closeLesson);
  overlay.addEventListener("click",function(e){if(e.target===overlay)closeLesson();});
  document.getElementById("markBtn").addEventListener("click",function(){
    if(!current)return;markDone(current.key);
    var mb=document.getElementById("markBtn");mb.classList.add("on");mb.innerHTML=ic('check')+" Passo concluído";
    renderHero();var nx=nextStepOf(current);if(nx)setTimeout(function(){openLesson(nx.key);},350);
  });
  document.getElementById("helpBtn").addEventListener("click",function(){window.open(supportHref(current?("Olá! Estou na aula \""+current.title+"\" e preciso de ajuda."):null),"_blank");});
  document.getElementById("fab").addEventListener("click",function(){window.open(supportHref(),"_blank");});
  document.getElementById("fullLink").setAttribute("href",CFG.fullMembersUrl);
  document.getElementById("q").addEventListener("input",function(){renderResults(this.value);});

  /* ---------- Deep-link ---------- */
  function deepKey(){var h=(location.hash||"").replace(/^#/,"");var m=/(?:^|&)aula=([^&]+)/.exec(h)||/(?:^|&)aula=([^&]+)/.exec(location.search.replace(/^\?/,""));return m?decodeURIComponent(m[1]):null;}

  function renderAll(){
    renderHero();renderCovers();
    renderRail("curso",LESSONS.filter(function(l){return l.cat==="curso";}));
    renderRail("extras",LESSONS.filter(function(l){return l.cat==="extra";}));
  }
  renderAll();
  var dk=deepKey();if(dk&&BY_KEY[dk])openLesson(dk);
  window.addEventListener("hashchange",function(){var k=deepKey();if(k&&BY_KEY[k])openLesson(k);});
})();
</script>
